<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    


    <script>

        // var num1 = 20;
        // var num2 =10;

        //input from use
        var num1 = prompt("Enter First number :");//String input nai
        var num2 = prompt("Enter second Number :");

        num1 = parseInt(num1,10); // string to int convert
        num2 = parseInt(num2, 10);




        var sum, sub,mul,div,modulus;
        sum = num1 + num2;
        document.write("Addition : " + sum + "<br/>");

        sub = num1 - num2;
        document.write(" Subtraction : " + sub + "<br/>");

        mul = num1 * num2;
        document.write("Mul :" + mul + "<br/>");

        div = num1 / num2;
        document.write("Division :" + div + "<br/>");

        modulus = num1 % num2;
        document.write("Modulus :" + modulus);

        


    </script>
</body>
</html>
